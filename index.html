em":"保障和改善民生的最终目标是（）。","options":[{"key":"A","text":"解决绝对贫困问题"},{"key":"B","text":"提高社会保障水平"},{"key":"C","text":"扎实推进全体人民共同富裕"},{"key":"D","text":"扩大公共服务范围"}],"answer":["C"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q262","type":"单选题","stem":"党的二十届四中全会指出，（ ）是中国式现代化的必然要求。","options":[{"key":"A","text":"坚持开放合作、互利共赢"},{"key":"B","text":"以开放促改革促发展"},{"key":"C","text":"扩大自自主开放"},{"key":"D","text":"推动贸易创新发展"}],"answer":["A"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q263","type":"多选题","stem":"党的二十届四中全会指出，（ ）是中国式现代化的战略支撑。","options":[{"key":"A","text":"巩固国防"},{"key":"B","text":"网络安全"},{"key":"C","text":"强大军队"},{"key":"D","text":"科技发展"}],"answer":["A","C"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q264","type":"多选题","stem":"下列哪些属于党的二十届四中全会提出的扩大高水平对外开放的具体举措？（）","options":[{"key":"A","text":"积极扩大自主开放"},{"key":"B","text":"推动贸易创新发展"},{"key":"C","text":"拓展双向投资合作空间"},{"key":"D","text":"高质量共建“一带一路”"}],"answer":["A","B","C","D"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q265","type":"多选题","stem":"为促进区域协调发展，党的二十届四中全会提出要发挥其叠加效应的战略包括（）。","options":[{"key":"A","text":"区域协调发展战略"},{"key":"B","text":"区域重大战略"},{"key":"C","text":"主体功能区战略"},{"key":"D","text":"新型城镇化战略"}],"answer":["A","B","C","D"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q266","type":"多选题","stem":"党的二十届四中全会提出，要加快建设哪些强国？（）","options":[{"key":"A","text":"制造强国、质量强国"},{"key":"B","text":"航天强国、交通强国"},{"key":"C","text":"网络强国、数字强国"},{"key":"D","text":"海洋强国、文化强国"}],"answer":["A","B"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q267","type":"判断题","stem":"党的二十届四中全会指出，应当坚持和完善社会主义基本经济制度，更好发挥经济体制改革牵引作用，完善宏观经济治理体系，确保高质量发展行稳致远。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q268","type":"判断题","stem":"推进政治监督常态化，思想上，要坚持不懈强化党的创新理论武装，准确把握党中央对本地区本部门本领域改革发展的目标定位和部署要求，确保思想统一、方向一致。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q269","type":"判断题","stem":"进入新时代，面对党内党风廉政建设和反腐败斗争的突出问题，我们坚持有腐必反、有贪必肃。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q270","type":"判断题","stem":"推进政治监督常态化，行动上，要坚持把党中央各项决策部署落实情况作为政治监督重点，合力推动改革攻坚、促进高质量发展。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1},{"id":"q271","type":"判断题","stem":"党的市（地、州、盟）和县（市、区、旗）委员会建立巡察制度，设立巡察机构，在一届任期内，对所管理的党组织实现巡察全覆盖。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"explanation":"","sources":["学习贯彻党的二十届四中全会精神"],"occurrences":1}]};</script><script>(() => {
'use strict';
const BANK=window.QUESTION_BANK,Q=BANK.questions,byId=Object.fromEntries(Q.map(q=>[q.id,q])),KEY='wengu-practice-v1';
const fresh=()=>({version:1,stats:{},favorites:[],wrong:{},sessions:[],current:null});
let data=fresh(),storageOK=true;try{const saved=localStorage.getItem(KEY);if(saved)data={...fresh(),...JSON.parse(saved)};}catch{storageOK=false;}
let page='home',filter={source:'全部题目',type:'全部题型',order:'random',limit:'20'},selected=[],textAnswer='',revealed=false,query='',wrongView='active';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch{storageOK=false;toast('存储不可用，请导出备份，避免刷新后丢失记录');}}
let toastTimer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',3000);}
const activeWrong=()=>Q.filter(q=>data.wrong[q.id]?.active);
const stats=()=>{const all=Object.values(data.stats),attempts=all.reduce((s,a)=>s+a.attempts,0),correct=all.reduce((s,a)=>s+a.correct,0);return{seen:all.length,attempts,correct,rate:attempts?Math.round(correct/attempts*100):0};};
function nav(mobile=false){return `<nav class="${mobile?'mobile-nav':'nav'}" aria-label="主要导航">${[['home','⌂','练习'],['wrong','↺','错题本'],['favorites','☆','收藏夹'],['records','▤','记录']].map(([key,icon,label])=>`<button data-page="${key}" class="${page===key?'active':''}">${mobile?`<span>${icon}</span>`:`<span class="nav-icon">${icon}</span>`}${label}</button>`).join('')}</nav>`;}
function render(){root.innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-symbol">温</span><div><strong>温故</strong><small>LEARN & RELEARN</small></div></div>${nav()}<div class="sidebar-foot">每一次重温，都是进步。<br>学习记录保存在当前浏览器</div></aside><main class="main"><div class="topbar"><span>温故 / 入党教育学习题库</span><span class="tag">历史记录 · 正确答案版</span></div>${page==='home'?home():page==='practice'?practice():page==='result'?result():page==='records'?records():bankPage()}</main>${nav(true)}</div>`;bind();}
function home(){const s=stats();return `<div class="eyebrow">A LITTLE PRACTICE, EVERY DAY</div><h1 class="title">随时练，反复记。</h1><p class="subtitle">从章节到综合，把每一道题真正记住。</p><section class="hero"><div class="eyebrow">TODAY'S PRACTICE</div><h2>温习已知，<br>让知识更进一步。</h2><p>题目取自已完成的测试记录，以原系统正确答案为准。答错自动收录，随时回来再练。</p><div class="hero-actions"><button class="btn" data-action="start">开始练习 <span>↗</span></button>${data.current?'<button class="btn ghost" data-action="resume">继续上次练习 →</button>':''}</div></section><div class="stats"><div class="stat"><span>题库总量</span><strong>${Q.length}<small> 题</small></strong><small>${BANK.rawCount} 道记录题目合并去重</small></div><div class="stat"><span>已练题目</span><strong>${s.seen}<small> / ${Q.length}</small></strong><small>累计练习 ${s.attempts} 次</small></div><div class="stat"><span>待巩固错题</span><strong>${activeWrong().length}<small> 题</small></strong><small>连续答对 2 次后标记掌握</small></div><div class="stat"><span>累计正确率</span><strong>${s.rate}<small> %</small></strong><small>收藏 ${data.favorites.length} 道好题</small></div></div><div class="section-heading"><h2>练习设置</h2><small>按你的节奏来</small></div><div class="filters"><label>练习范围<select id="source">${['全部题目',...BANK.sources.map(x=>x.name)].map(s=>`<option ${filter.source===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>题目类型<select id="type">${['全部题型','单选题','多选题','判断题','填空题'].map(s=>`<option ${filter.type===s?'selected':''}>${s}</option>`).join('')}</select></label><label>出题顺序<select id="order"><option value="random" ${filter.order==='random'?'selected':''}>随机练习</option><option value="sequence" ${filter.order==='sequence'?'selected':''}>顺序练习</option></select></label><label>本轮题量<select id="limit">${['10','20','50','全部'].map(s=>`<option ${filter.limit===s?'selected':''}>${s}</option>`).join('')}</select></label></div><button class="btn primary" data-action="start">开始本轮练习 →</button><div class="section-heading"><h2>按章节温习</h2><small>${BANK.sources.length} 个题目来源</small></div><div class="chapters">${BANK.sources.map((s,i)=>{const qs=Q.filter(q=>q.sources.includes(s.name)),done=qs.filter(q=>data.stats[q.id]).length;return `<button class="chapter" data-chapter="${i}"><span class="chapter-num">${String(i+1).padStart(2,'0')}</span><div style="flex:1"><strong>${esc(s.name)}</strong><small>${qs.length} 题 · 已练 ${done} 题${s.name==='综合测试'?' · 综合巩固':''}</small><div class="progress"><i style="width:${done/qs.length*100}%"></i></div></div><span class="arrow">↗</span></button>`;}).join('')}</div><p class="source-note">来源：9 份章节自测记录 + 1 份综合测试记录，整理于 ${BANK.generatedAt}。<br>答案完整保留原系统标注；原记录未提供的解析不另行编写。手机与电脑的练习记录各自保存在本机，可通过备份迁移。</p>`;}
function pool(){return Q.filter(q=>(filter.source==='全部题目'||q.sources.includes(filter.source))&&(filter.type==='全部题型'||q.type===filter.type));}
function start(qs=pool(),label=filter.source,unlimited=false){if(!qs.length){toast('当前范围暂无题目');return;}let ids=qs.map(q=>q.id);if(filter.order==='random'){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}}if(!unlimited&&filter.limit!=='全部')ids=ids.slice(0,Number(filter.limit));data.current={ids,index:0,answers:{},label,startedAt:new Date().toISOString()};save();resetAnswer();page='practice';render();window.scrollTo(0,0);}
function resetAnswer(){selected=[];textAnswer='';revealed=false;}
function currentQ(){return byId[data.current.ids[data.current.index]];}
function practice(){if(!data.current){page='home';return home();}const c=data.current,q=currentQ(),a=c.answers[q.id],locked=!!a;return `<div class="practice-top"><button class="text-btn" data-page="home">← 返回练习</button><span class="session-label">${c.index+1} / ${c.ids.length}</span><button class="btn" data-action="favorite">${data.favorites.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button></div><div class="progress"><i style="width:${Object.keys(c.answers).length/c.ids.length*100}%"></i></div><article class="panel"><div class="question-meta"><span class="pill">${q.type}</span><span class="tiny">${q.type==='多选题'?'选全正确选项才得分':q.type==='填空题'?'填写原系统答案，忽略空白和标点':'请选择一个正确答案'}</span></div><h1 class="question-title">${esc(q.stem)}</h1>${q.type==='填空题'?`<label><span class="tiny">你的答案</span><input class="fill-input" id="fill" placeholder="请输入答案" autocomplete="off" value="${esc(a?a.text:textAnswer)}" ${locked?'disabled':''}></label>`:`<div class="options">${q.options.map(o=>{const chosen=locked?a.selected.includes(o.key):selected.includes(o.key);return `<button class="option ${chosen?'selected':''} ${locked&&q.answer.includes(o.key)?'correct':''} ${locked&&chosen&&!q.answer.includes(o.key)?'incorrect':''}" data-option="${o.key}" aria-pressed="${chosen}" ${locked?'disabled':''}><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`;}).join('')}</div>`}${locked?`<div class="answer-box ${a.correct?'':'wrong'}"><strong>${a.revealed?'已查看答案':a.correct?'✓ 回答正确':'答错了，再巩固一次'}</strong><p>正确答案：${esc(q.answer.join(q.type==='填空题'?'；':''))}</p>${q.type!=='填空题'?`<p>${q.options.filter(o=>q.answer.includes(o.key)).map(o=>esc(o.key+' · '+o.text)).join('<br>')}</p>`:''}${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<small>${a.revealed?'本题按未掌握记录，并加入错题本。':a.correct?'已记录本次练习。':'已自动加入错题本。'} ${data.wrong[q.id]?.active?`连续答对进度：${data.wrong[q.id].streak||0}/2。`:''}答案取自原系统历史记录。</small></div>`:''}<p class="source">来源：${esc(q.sources.join(' / '))}</p><div class="question-actions"><button class="btn" data-action="prev" ${c.index===0?'disabled':''}>上一题</button>${!locked?'<button class="text-btn" data-action="reveal">查看答案</button>':''}${!locked?'<button class="btn primary" data-action="check">确认答案</button>':`<button class="btn primary" data-action="next">${c.index===c.ids.length-1?'查看本轮结果':'下一题 →'}</button>`}</div></article><section class="panel"><div class="section-heading" style="margin:0"><h2>答题卡</h2><small>绿：答对 / 红：待巩固</small></div><div class="q-grid">${c.ids.map((id,i)=>`<button data-jump="${i}" class="${i===c.index?'current':''} ${c.answers[id]?(c.answers[id].correct?'done':'miss'):''}" aria-label="第 ${i+1} 题">${i+1}</button>`).join('')}</div><div class="section-heading"><span class="tiny">练习进度自动保存</span><button class="text-btn" data-action="finish">结束本轮并查看结果 →</button></div></section>`;}
const normalize=s=>s.normalize('NFKC').replace(/[\s，。；：、,.!?！？;:“”"'‘’（）()]/g,'');
function check(reveal=false){const q=currentQ(),c=data.current;if(c.answers[q.id])return;if(!reveal&&!(q.type==='填空题'?textAnswer.trim():selected.length)){toast('请先作答');return;}const correct=!reveal&&(q.type==='填空题'?normalize(textAnswer)===normalize(q.answer.join('')):selected.slice().sort().join('')===q.answer.slice().sort().join(''));
c.answers[q.id]={correct,selected:[...selected],text:textAnswer,revealed:reveal};const s=data.stats[q.id]||{attempts:0,correct:0};s.attempts++;s.correct+=Number(correct);s.lastAt=new Date().toISOString();data.stats[q.id]=s;
if(!correct){const w=data.wrong[q.id]||{count:0};data.wrong[q.id]={...w,count:w.count+1,active:true,streak:0};}else if(data.wrong[q.id]?.active){data.wrong[q.id].streak=(data.wrong[q.id].streak||0)+1;if(data.wrong[q.id].streak>=2){data.wrong[q.id].active=false;toast('这道错题已连续答对 2 次，标记为已掌握');}}
save();render();}
function finish(){const c=data.current;const answered=Object.keys(c.answers).length;if(!answered){toast('请至少练习一道题后再查看结果');return;}c.finishedAt=new Date().toISOString();data.sessions.unshift({...c});data.sessions=data.sessions.slice(0,100);data.current=null;save();page='result';render();window.scrollTo(0,0);}
function result(){const c=data.sessions[0];if(!c)return '<div class="empty">暂无练习记录</div>';const a=Object.values(c.answers),correct=a.filter(x=>x.correct).length,wrong=Object.keys(c.answers).filter(id=>!c.answers[id].correct);return `<div class="eyebrow">PRACTICE COMPLETED</div><h1 class="title">每一遍，都更熟悉一点。</h1><section class="panel result"><span class="pill">本轮练习结果</span><div class="result-score">${Math.round(correct/a.length*100)}<small> % 正确率</small></div><p>本轮 ${c.ids.length} 题 · 已答 ${a.length} 题 · 答对 ${correct} 题 · 待巩固 ${wrong.length} 题</p><p class="tiny">未作答 ${c.ids.length-a.length} 题，不计入本轮正确率</p><div class="hero-actions"><button class="btn primary" data-action="retry-all">再刷一遍</button>${wrong.length?'<button class="btn" data-action="retry-missed">只刷本轮错题</button>':''}<button class="btn" data-page="home">返回首页</button></div></section>`;}
function bankPage(){const wrong=page==='wrong';let qs=wrong?Q.filter(q=>data.wrong[q.id]&&(wrongView==='all'||data.wrong[q.id].active)):Q.filter(q=>data.favorites.includes(q.id));if(query)qs=qs.filter(q=>(q.stem+q.options.map(o=>o.text).join('')).includes(query));return `<div class="eyebrow">${wrong?'REVISIT & REMEMBER':'YOUR COLLECTION'}</div><h1 class="title">${wrong?'错题，再练一遍。':'把重点，留给自己。'}</h1><p class="subtitle">${wrong?'答错自动收录，连续答对两次后标记掌握，历史错题仍可重刷。':'随手收藏难点，随时开启专项练习。'}</p><div class="section-heading"><span class="tiny">${qs.length} 道${query?'匹配':''}题目</span><button class="btn primary" data-action="start-bank" ${!qs.length?'disabled':''}>${wrong?'重刷这些错题':'练习这些收藏'} →</button></div>${wrong?`<label class="checkline"><input id="wrongAll" type="checkbox" ${wrongView==='all'?'checked':''}>包含已掌握的历史错题</label>`:''}<input class="search-input" id="search" placeholder="搜索题干或选项" aria-label="搜索题目" value="${esc(query)}"><section class="panel">${qs.length?qs.map(q=>`<article class="bank-item"><div class="row"><span class="pill">${q.type}</span><small class="tiny">${wrong?`累计错 ${data.wrong[q.id].count} 次 · ${data.wrong[q.id].active?'待巩固':'已掌握'}`:'已收藏'}</small></div><h3>${esc(q.stem)}</h3><p>${esc(q.sources.join(' / '))}</p><div class="row"><button class="text-btn" data-practice-one="${q.id}">练习此题 →</button><button class="text-btn" ${wrong?`data-master="${q.id}"`:`data-unfavorite="${q.id}"`}>${wrong?(data.wrong[q.id].active?'标记掌握':'重新巩固'):'取消收藏'}</button></div></article>`).join(''):`<div class="empty"><div class="empty-icon">${wrong?'↺':'☆'}</div><h2>${query?'没有找到匹配题目':wrong?'暂时没有待巩固错题':'收藏你的第一道重点题'}</h2><p>${query?'换个关键词试试。':wrong?'练习中答错的题会自动出现在这里。':'练习时点击右上角“收藏”，即可随时重刷。'}</p><button class="btn" data-page="home">去练习 →</button></div>`}</section>`;}
function records(){return `<div class="eyebrow">YOUR LEARNING JOURNEY</div><h1 class="title">看见每一步积累。</h1><p class="subtitle">记录保存在当前浏览器，导出备份可以迁移到另一台设备。</p>${!storageOK?'<div class="notice">Safari 当前打开方式无法持久保存学习记录。你仍可正常刷题，但关闭页面前请导出备份；若希望长期保存，建议通过 Safari 的正常网页地址打开。</div>':''}<section class="panel"><div class="section-heading" style="margin-top:0"><h2>题库与备份</h2><small>整理于 ${BANK.generatedAt}</small></div><p class="tiny">${BANK.rawCount} 道原始记录 · ${Q.length} 道去重题目 · ${BANK.sources.length} 个来源<br>仅包含题目、选项和原系统正确答案，不包含姓名、学号、原考试成绩或个人作答。</p><div class="settings-actions"><button class="btn primary" data-action="export">导出学习备份</button><button class="btn" data-action="import">恢复学习备份</button><button class="btn" data-action="export-bank">下载 JSON 题库</button></div><input id="import-file" type="file" accept="application/json,.json" hidden><p class="tiny">恢复备份会替换本机学习记录；请先导出当前备份。查看答案按未掌握记录；填空题按原答案匹配，忽略空白和常见标点。</p></section><section class="panel"><div class="section-heading" style="margin-top:0"><h2>最近练习</h2><small>保留最近 100 轮</small></div>${data.sessions.length?data.sessions.map((s,i)=>{const a=Object.values(s.answers),right=a.filter(x=>x.correct).length;return `<div class="history-row"><div>${esc(s.label)}<br><small>${esc(new Date(s.finishedAt).toLocaleString('zh-CN'))} · 已答 ${a.length}/${s.ids.length} 题</small></div><div style="text-align:right">${Math.round(right/a.length*100)}%<br><button class="text-btn" data-retry-session="${i}">重新刷题 ↗</button></div></div>`;}).join(''):'<p class="empty">完成一轮练习后，这里会留下你的足迹。</p>'}</section><div class="notice">iPhone Safari：打开网页后可用“共享 → 添加到主屏幕”，并开启“作为网页 App 打开”。题库答案忠实保留历史记录标注。相同题目若答案或选项内容不同会分别保留；未提供的解析不作补写。</div>`;}
async function download(name,value){const text=JSON.stringify(value,null,2),blob=new Blob([text],{type:'application/json;charset=utf-8'});try{const file=new File([blob],name,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
function navigate(p){page=p;query='';resetAnswer();render();window.scrollTo(0,0);}
function bind(){root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));for(const k of ['source','type','order','limit']){const el=document.getElementById(k);if(el)el.onchange=()=>filter[k]=el.value;}
root.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{filter.source=BANK.sources[Number(b.dataset.chapter)].name;filter.type='全部题型';start(pool(),filter.source,true);});
root.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{const q=currentQ(),k=b.dataset.option;if(q.type==='多选题')selected=selected.includes(k)?selected.filter(x=>x!==k):[...selected,k];else selected=[k];render();});
root.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{data.current.index=Number(b.dataset.jump);resetAnswer();save();render();window.scrollTo(0,0);});
const f=document.getElementById('fill');if(f){f.oninput=()=>textAnswer=f.value;f.onkeydown=e=>{if(e.key==='Enter')check();};}
const search=document.getElementById('search');if(search)search.oninput=()=>{const pos=search.selectionStart;query=search.value;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos);};
const all=document.getElementById('wrongAll');if(all)all.onchange=()=>{wrongView=all.checked?'all':'active';render();};
root.querySelectorAll('[data-practice-one]').forEach(b=>b.onclick=()=>start([byId[b.dataset.practiceOne]],'单题巩固',true));
root.querySelectorAll('[data-unfavorite]').forEach(b=>b.onclick=()=>{data.favorites=data.favorites.filter(id=>id!==b.dataset.unfavorite);save();render();});
root.querySelectorAll('[data-master]').forEach(b=>b.onclick=()=>{const w=data.wrong[b.dataset.master];w.active=!w.active;w.streak=w.active?0:2;save();render();});
root.querySelectorAll('[data-retry-session]').forEach(b=>b.onclick=()=>{const s=data.sessions[Number(b.dataset.retrySession)];start(s.ids.map(id=>byId[id]),s.label,true);});
root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
const file=document.getElementById('import-file');if(file)file.onchange=async()=>{if(!file.files[0])return;try{const backup=JSON.parse(await file.files[0].text());const d=backup.data;if(backup.format!=='wengu-backup-v1'||!d||!Array.isArray(d.favorites)||!Array.isArray(d.sessions)||!d.stats||!d.wrong)throw Error();const ids=[...d.favorites,...Object.keys(d.stats),...Object.keys(d.wrong),...d.sessions.flatMap(s=>s.ids||[]),...(d.current?.ids||[])];if(ids.some(id=>!byId[id]))throw Error();for(const s of Object.values(d.stats))if(!Number.isFinite(s.attempts)||s.attempts<0||!Number.isFinite(s.correct)||s.correct<0||s.correct>s.attempts)throw Error();for(const s of [...d.sessions,...(d.current?[d.current]:[])])if(!Array.isArray(s.ids)||!s.ids.length||!s.answers||s.ids.some(id=>!byId[id])||s.index<0||s.index>=s.ids.length)throw Error();if(!window.confirm('恢复此备份将替换当前浏览器中的学习记录，确定恢复吗？'))return;data={...fresh(),...d};save();render();toast('学习备份已恢复');}catch{toast('备份格式无效或题库版本不匹配，未修改当前记录');}};
}
function action(a){if(a==='start')start();if(a==='resume'){page='practice';resetAnswer();render();}if(a==='favorite'){const id=currentQ().id;data.favorites=data.favorites.includes(id)?data.favorites.filter(x=>x!==id):[...data.favorites,id];save();render();}if(a==='check')check();if(a==='reveal')check(true);if(a==='next'||a==='prev'){const c=data.current;if(a==='next'&&c.index===c.ids.length-1){finish();return;}c.index+=a==='next'?1:-1;resetAnswer();save();render();window.scrollTo(0,0);}if(a==='finish')finish();if(a==='retry-all'){const s=data.sessions[0];start(s.ids.map(id=>byId[id]),s.label,true);}if(a==='retry-missed'){const s=data.sessions[0];start(Object.keys(s.answers).filter(id=>!s.answers[id].correct).map(id=>byId[id]),'本轮错题',true);}if(a==='start-bank'){let qs=page==='wrong'?Q.filter(q=>data.wrong[q.id]&&(wrongView==='all'||data.wrong[q.id].active)):Q.filter(q=>data.favorites.includes(q.id));if(query)qs=qs.filter(q=>(q.stem+q.options.map(o=>o.text).join('')).includes(query));start(qs,page==='wrong'?'错题重刷':'收藏练习',true);}if(a==='export')download('温故-学习备份-'+new Date().toISOString().slice(0,10)+'.json',{format:'wengu-backup-v1',exportedAt:new Date().toISOString(),data});if(a==='export-bank')download('温故-题库.json',BANK);if(a==='import')document.getElementById('import-file').click();}
render();
})();
</script></body></html>
